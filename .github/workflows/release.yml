name: Release

# A pushed version tag (v1.2.3, equal to package.json's version) builds the
# desktop packages on each platform, smoke-tests every package as it ships
# and attaches it to the tag's GitHub Release: a draft created here when there
# is none yet. Publishing the draft stays a manual step (docs/RELEASING.md).
#
# No secret is required: without signing credentials the Windows installer is
# unsigned and the Mac app is signed ad hoc. With these repository secrets the
# same jobs sign (and notarize):
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (code signing .pfx, base64)
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application .p12, base64)
#            and APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, or
#            APPLE_API_KEY (the .p8 text), APPLE_API_KEY_ID, APPLE_API_ISSUER
#
# Only the jobs that call gh can write to the repository, and only their gh
# steps get the token: the builds (npm ci with every dependency's install
# scripts, electron-builder and its downloads) run with read access and hand
# their packages over as workflow artifacts. The publish job attests their
# provenance, attaches them and lists the checksums of the files it built,
# not of whatever the release holds by then. Actions are pinned by commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, e.g. v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # The package names carry package.json's version.
      - name: Check the version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match package.json's version $version"
            exit 1
          fi

      - name: Create the draft release when there is none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json isDraft,url --jq '"\(.url) (draft: \(.isDraft))"'; then
            echo "The release exists: the packages are added to it."
          else
            sed "s/<version>/${TAG#v}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --draft --verify-tag --title "ShellMind ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    name: Package (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            packages: release/*.exe
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            packages: release/*.AppImage release/*.deb
          - name: macOS arm64
            os: macos-14
            platform: mac
            arch: arm64
            packages: release/*.dmg release/*.zip
          - name: macOS x64
            # The Intel image (macos-13 is retired).
            os: macos-15-intel
            platform: mac
            arch: x64
            packages: release/*.dmg release/*.zip
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # The Linux packages install their dependencies inside the container.
          cache: ${{ matrix.platform != 'linux' && 'npm' || '' }}

      - name: Install dependencies
        if: matrix.platform != 'linux'
        run: npm ci

      - name: Build
        if: matrix.platform != 'linux'
        run: npm run build

      - name: Package
        if: matrix.platform != 'linux'
        env:
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: node scripts/dist.mjs --${{ matrix.platform }} --arch ${{ matrix.arch }} --out release

      # As `npm run dist:linux`: in a Debian 11 container (glibc 2.31), which
      # also smoke-tests the AppImage and the .deb there.
      - name: Package (Debian 11 container)
        if: matrix.platform == 'linux'
        run: node scripts/dist-linux-docker.mjs --out release

      # The installer as users get it: Windows installs it silently and
      # uninstalls it, a Mac mounts the dmg and unpacks the zip.
      - name: Smoke-test the packages
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          for package in ${{ matrix.packages }}; do
            node scripts/smoke-packaged.mjs "$package"
          done

      - name: Collect the packages
        shell: bash
        run: |
          shopt -s nullglob
          files=(${{ matrix.packages }})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No package matches ${{ matrix.packages }}"
            exit 1
          fi
          mkdir packages
          cp -- "${files[@]}" packages/

      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Attach to the release
    needs: [draft, build]
    # The platforms that built: a failed one can be re-run on its own.
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages

      - name: List the packages
        working-directory: packages
        run: |
          shopt -s nullglob
          files=(*.exe *.AppImage *.deb *.dmg *.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No platform built a package"
            exit 1
          fi
          ls -l

      # Signed (Sigstore) provenance of each package, which shows that this
      # workflow built it from the tag, signed with a certificate or not:
      # `gh attestation verify <package> --repo <owner>/<repo>`.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*

      - name: Attach the packages and their checksums
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(*)
          # The checksums of the files built here.
          sha256sum -- "${files[@]}" > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$TAG" "${files[@]}" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          else
            # A published release keeps the files people may have downloaded,
            # and the checksums that describe them.
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            kept=0
            for file in "${files[@]}"; do
              if grep -qxF "$file" <<< "$existing"; then
                echo "::warning::$TAG is published and has $file already: kept as it is"
                kept=1
              else
                gh release upload "$TAG" "$file"
              fi
            done
            if grep -qxF SHA256SUMS.txt <<< "$existing"; then
              echo "::warning::$TAG is published: its SHA256SUMS.txt is kept; add the lines of new packages by hand"
            elif [ "$kept" -eq 0 ]; then
              gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt"
            else
              echo "::warning::$TAG is published with packages built before: no SHA256SUMS.txt is added"
            fi
          fi
